version: "3.8"
services:
  void:
    build: .
    image: void-cloud-rsps:personal-tweaks
    volumes:
      # Required: use a persistent directory outside the Git checkout.
      - ${VOID_SAVES_DIR:?Set VOID_SAVES_DIR to a persistent saves directory}:/app/data/saves
    environment:
      storage.type: files
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx3g -XX:MaxMetaspaceSize=512m"
    ports:
      - "43594:43594"
      - "8080:8080"
    networks:
      - internal_network
networks:
  internal_network:
    driver: bridge
